name: "CI"
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
jobs:
  test:
    name: Cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
  format:
    name: Cargo format (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
  cross:
    name: Cargo cross build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross
      - name: Build
        run: cross build --target ${{ matrix.target }}
  wasm:
    name: npm WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: '0.2.114'
      - name: Build npm package
        run: npm run build --prefix npm
      - name: Optimize browser wasm
        uses: NiklasEi/wasm-opt-action@v2
        with:
          options: -Oz
          file: npm/pkg/web/tex_fmt_bg.wasm
          output: npm/pkg/web/tex_fmt_bg.wasm
      - name: Update web app wasm
        run: cp npm/pkg/web/tex_fmt_bg.wasm web/pkg/tex_fmt_bg.wasm
      - name: Test npm entry points
        run: npm test --prefix npm
      - name: Test packed npm package
        run: npm run test:package --prefix npm
      - name: Upload wasm
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: web/pkg/
  pages:
    if: github.ref == 'refs/heads/main'
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v3
      - name: Download WASM and JS artifacts
        uses: actions/download-artifact@v4
        with:
          name: pkg
          path: web/pkg
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web
  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 1G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-last-accessed: P1DT12H
        purge-primary-key: never
    - run: nix build
    - run: nix flake check --all-systems
