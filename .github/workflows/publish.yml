name: "Publish"
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    name: Build (${{ matrix.archive  }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            program: cargo
            archive: tex-fmt-x86_64-windows.zip
          - os: windows-latest
            target: i686-pc-windows-msvc
            program: cargo
            archive: tex-fmt-i686-windows.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            program: cargo
            archive: tex-fmt-aarch64-windows.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            program: cargo
            archive: tex-fmt-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            program: cargo
            archive: tex-fmt-aarch64-macos.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            program: cargo
            archive: tex-fmt-x86_64-linux.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            program: cross
            archive: tex-fmt-aarch64-linux.tar.gz
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            program: cross
            archive: tex-fmt-armv7hf-linux.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            program: cargo
            archive: tex-fmt-x86_64-alpine.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: ${{ matrix.program == 'cross' }}
        run: cargo install cross
      - name: Build
        run: |
          ${{ matrix.program }} build --target ${{ matrix.target }} --all-features --release --locked
      - name: Compress (windows)
        if: ${{ contains(matrix.os, 'windows') }}
        run: |
          ${{ format('Compress-Archive target/{0}/release/tex-fmt.exe {1}',
            matrix.target, matrix.archive) }}
      - name: Compress (macos)
        if: ${{ contains(matrix.os, 'macos') }}
        run: |
          ${{ format('gtar -czvf {1} -C target/{0}/release tex-fmt',
            matrix.target, matrix.archive) }}
      - name: Compress (linux)
        if: ${{ contains(matrix.os, 'ubuntu') }}
        run: |
          ${{ format('tar -czvf {1} -C target/{0}/release tex-fmt',
            matrix.target, matrix.archive) }}
      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
  github:
    name: GitHub archive upload
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Publish binaries
        run: |
          gh release upload ${{ github.ref_name }} $(find . -iname tex-fmt*.zip)
          gh release upload ${{ github.ref_name }} $(find . -iname tex-fmt*.tar.gz)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  npm:
    if: github.event_name == 'release'
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: '0.2.114'
      - name: Check release version
        working-directory: npm
        run: npm run check:version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Build npm package
        run: npm run build --prefix npm
      - name: Optimize browser wasm
        uses: NiklasEi/wasm-opt-action@v2
        with:
          options: -Oz
          file: npm/pkg/web/tex_fmt_bg.wasm
          output: npm/pkg/web/tex_fmt_bg.wasm
      - name: Test npm entry points
        run: npm test --prefix npm
      - name: Test packed npm package
        run: npm run test:package --prefix npm
      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
